<main id="main" class="note-page">
  <header class="note-header">
    <p class="eyebrow">Research note · <time datetime="${date}">${date_label}</time></p>
    <h1>${title}</h1>
  </header>
  <nav class="note-contents" aria-label="On this page">
    <h2>On this page</h2>
    ${toc}
  </nav>
  <article class="article" aria-label="${title}">
    ${body}
  </article>
</main>
